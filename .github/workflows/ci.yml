# Typecheck, tests and a production build on every push and PR.
#
# Ubuntu is in the matrix deliberately: development happens on Windows, so CI
# is the only thing continuously proving the POSIX paths. macOS is left out —
# GitHub bills macOS minutes at 10x on private repos, and the mac-specific code
# is a thin per-OS command table that Ubuntu already exercises structurally.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for GITHUB_TOKEN. CI only ever reads the repository, and
# `npm ci` runs third-party install scripts — a token that cannot write is one
# a compromised dependency cannot push with.
permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Both the version CI pins and the one development actually happens on.
        # A single-version job cannot see a break that only one runtime has, and
        # Node now ships web globals that shadow test-environment ones — exactly
        # the class of failure that stays invisible until someone else's machine.
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx tsc -b shared server web
      - run: npm test
      - run: npm run build

[package]
name = "claudia-shell"
version = "0.1.0"
description = "Claudia desktop shell (Tauri 2 window over the local Node server)"
license = "AGPL-3.0-only"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# generate_context! expands to serde_json once tauri.conf.json carries a
# plugin config or capabilities, and health-probe parsing wants real JSON
# rather than substring matching (see `health_body_ok`).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Native OS notifications. Registering this plugin auto-injects a
# window.Notification shim (see init-iife.js in the plugin itself) that
# routes through the native notifier instead of the webview's own (patchy,
# especially on macOS) Notification Web API — so the existing, untouched
# web/src/notifications.ts keeps working unmodified, just backed by a real
# OS toast. Requires the remote-IPC capability grant in capabilities/main.json
# because the UI is always loaded from http://127.0.0.1:<port>, never from
# the tauri:// origin.
tauri-plugin-notification = "2"

[dev-dependencies]
# Exercises the exact same remote-URL matcher Tauri's ACL uses at runtime, so
# the capability's `remote.urls` pattern (capabilities/main.json) is verified
# against a fixed port AND an arbitrary ephemeral one without needing to
# launch the GUI. See tests::capability_remote_pattern_matches_any_port.
tauri-utils = "2.9"
url = "2"

[profile.release]
strip = true
lto = true

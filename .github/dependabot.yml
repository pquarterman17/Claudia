# Monthly, not weekly: this is a personal tool and PR noise costs more than
# being a few weeks behind. Security advisories still arrive immediately.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      all-minor-and-patch:
        update-types: ["minor", "patch"]

  # Workflow actions are dependencies too, and a compromised action runs with
  # whatever the job's token allows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claudia</title>
    <style>
      /* Static splash shown by the Tauri shell while it decides whether to
         attach to an already-running Claudia server or spawn a new one, and
         while that server boots. Served from the `claudia-splash://` custom
         protocol (see main.rs) rather than a file under web/, so this stays
         entirely inside src-tauri/ and never depends on web/dist existing.
         Loaded before the real UI, so it can't read web/src/nocturne.css —
         these colours are copied from its --color-bg / --color-accent. */
      :root { color-scheme: dark; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        background: #161826;
        color: #b7b4c9;
        font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      .spinner {
        width: 34px;
        height: 34px;
        border: 3px solid #2b2741;
        border-top-color: #9184d9;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .title { font-size: 15px; font-weight: 600; letter-spacing: 0.02em; color: #f2f1fa; }
      .sub { font-size: 12.5px; color: #7d7a91; }
      #error {
        display: none;
        max-width: 30rem;
        padding: 0.75rem 1rem;
        text-align: center;
        color: #f2b8b8;
        background: #3a2020;
        border: 1px solid #6b3535;
        border-radius: 8px;
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner { animation: none; }
      }
    </style>
  </head>
  <body>
    <div class="spinner" id="spinner"></div>
    <div class="title">Starting Claudia…</div>
    <div class="sub" id="sub">Looking for a running session board</div>
    <div id="error"></div>
    <script>
      // The Tauri shell calls window.__claudiaError(msg) (via eval) if it
      // can't reach a server (spawned or attached), turning a blank
      // "can't reach this page" into an actionable message.
      window.__claudiaError = function (msg) {
        document.getElementById("spinner").style.display = "none";
        document.getElementById("sub").style.display = "none";
        var e = document.getElementById("error");
        e.textContent = msg;
        e.style.display = "block";
      };
    </script>
  </body>
</html>
